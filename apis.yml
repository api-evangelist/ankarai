name: ankar.ai
description: 'Ankar is an AI operating system built for patent professionals, covering the full patent
  lifecycle: idea generation and patentability assessment, drafting of invention disclosures and applications,
  prosecution including office-action responses and strategy, and protection through infringement monitoring
  and competitive intelligence. It also provides small-molecule and sequence analysis, claim charts,
  research intelligence, and traceable citations to guidelines and case law. Customers are patent law
  firms and in-house IP teams (AmLaw 100 firms and Fortune 500 corporations), with 1,000+ users. Ankar
  is SOC 2 Type 2 and ISO 27001:2022 certified and does not train AI models on customer data. It is
  enterprise-sold (book-a-demo) and publishes no public developer API at this time.'
